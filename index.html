/* ==========================================================
   КОНЕЦ БЛОКА РЕДАКТИРОВАНИЯ
   ========================================================== */

const root = document.documentElement;
const $ = (s) => document.querySelector(s);

const main        = $("#subjects");
const search      = $("#search");
const clearBtn    = $("#clear");
const modal       = $("#modal");
const modalBody   = $("#modal-body");
const closeBtn    = $("#close");
const toggleAllBtn= $("#toggle-all");
const themeBtn    = $("#theme");

const MONTHS_SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONTHS_FULL  = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

/* ---------- утилиты ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function dateParts(iso) {
  if (!iso) return null;
  const p = String(iso).split("-");
  if (p.length !== 3) return null;
  const m = parseInt(p[1], 10) - 1;
  if (isNaN(m) || m < 0 || m > 11) return null;
  return { d: p[2], m, y: p[0] };
}

function fmtDate(iso) {
  const p = dateParts(iso);
  return p ? `${p.d}.${String(p.m + 1).padStart(2, "0")}.${p.y}` : (iso || "—");
}

function fmtLong(iso) {
  const p = dateParts(iso);
  return p ? `${parseInt(p.d, 10)} ${MONTHS_FULL[p.m]} ${p.y}` : (iso || "—");
}

function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}

function initials(name) {
  const clean = String(name).replace(/\(.*?\)/g, " ").trim();
  const words = clean.split(/\s+/).filter(Boolean);
  return ((words[0] ? words[0][0] : "?") + (words[1] ? words[1][0] : "")).toUpperCase();
}

function hueOf(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}

function markStyle(name) {
  const h = hueOf(name);
  return `background:linear-gradient(135deg,hsl(${h} 72% 58%),hsl(${(h + 45) % 360} 72% 48%))`;
}

/* ---------- шапка ---------- */
document.title = DATA.groupName;
$("#group-title").textContent = DATA.groupName;

const TOTAL = DATA.subjects.reduce((n, s) => n + s.lessons.length, 0);
$("#stats").textContent = `${TOTAL} ${plural(TOTAL, "запись", "записи", "записей")}`;

/* ---------- дата последнего обновления ---------- */
(function () {
  const el = $("#last-update");
  if (!el) return;
  const iso = DATA.lastUpdate;
  if (!iso) { el.textContent = "не указано"; return; }

  el.textContent = fmtLong(iso);

  const p = dateParts(iso);
  if (!p) return;

  const diff = Math.floor((Date.now() - new Date(iso + "T00:00:00").getTime()) / 86400000);
  if (diff >= 0 && diff <= 30) {
    el.parentElement.parentElement.classList.add("fresh");
    el.title = diff === 0 ? "Обновлено сегодня"
             : diff === 1 ? "Обновлено вчера"
             : `Обновлено ${diff} ${plural(diff, "день", "дня", "дней")} назад`;
  }
})();

/* ---------- рендер ---------- */
let allOpen = false;

function matchesQuery(subj, l, words) {
  const hay = [
    subj.name,
    l.teacher || subj.teacher || "",
    l.comment || "",
    fmtDate(l.date),
    fmtLong(l.date),
    l.pair ? l.pair + " пара" : ""
  ].join(" ").toLowerCase();
  return words.every(w => hay.includes(w));
}

function lessonHTML(subj, l, si, li) {
  const p     = dateParts(l.date);
  const day   = p ? String(parseInt(p.d, 10)) : "—";
  const mon   = p ? MONTHS_SHORT[p.m] : "";
  const teach = (l.teacher || subj.teacher || "").trim();
  const meta  = [
    teach && teach !== "-" ? teach : "",
    l.pair ? l.pair + " пара" : ""
  ].filter(Boolean).join(" · ");
  const hasLink = !!(l.link && String(l.link).trim());

  return `
    <button class="lesson" type="button" data-si="${si}" data-li="${li}">
      <span class="lesson-date"><b>${esc(day)}</b><i>${esc(mon)}</i></span>
      <span class="lesson-main">
        <span class="lesson-title">${esc(l.comment || "Занятие")}</span>
        <span class="lesson-meta">${esc(meta || "—")}</span>
      </span>
      <span class="pill${hasLink ? " on" : ""}">
        <i class="dot"></i><span>${hasLink ? "запись" : "нет записи"}</span>
      </span>
    </button>`;
}

function render() {
  const q     = search.value.trim().toLowerCase();
  const words = q ? q.split(/\s+/).filter(Boolean) : [];
  clearBtn.hidden = !q;

  let html = "";
  let found = 0;

  DATA.subjects.forEach((subj, si) => {
    const items = subj.lessons
      .map((l, li) => ({ l, li }))
      .filter(({ l }) => !words.length || matchesQuery(subj, l, words));

    if (words.length && !items.length) return;
    found += items.length;

    const isOpen = words.length > 0 || allOpen;
    const teacher = (subj.teacher || "").trim();

    html += `
      <section class="subject${isOpen ? " open" : ""}">
        <button class="subject-header" type="button" aria-expanded="${isOpen}">
          <span class="subj-mark" style="${markStyle(subj.name)}">${esc(initials(subj.name))}</span>
          <span class="subj-info">
            <span class="subj-name">${esc(subj.name)}</span>
            <span class="subj-teacher">${esc(teacher && teacher !== "-" ? teacher : "преподаватель не указан")}</span>
          </span>
          <span class="count">${items.length}</span>
          <span class="chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </span>
        </button>
        <div class="subject-body">
          <div class="subject-inner">
            <div class="lessons">
              ${items.length
                ? items.map(({ l, li }) => lessonHTML(subj, l, si, li)).join("")
                : `<div class="no-lessons">Занятий пока нет</div>`}
            </div>
          </div>
        </div>
      </section>`;
  });

  main.innerHTML = found ? html : `
    <div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
      </div>
      <p>Ничего не найдено</p>
      <span>Попробуйте изменить запрос</span>
    </div>`;
}

/* ---------- клики по списку ---------- */
main.addEventListener("click", (e) => {
  const header = e.target.closest(".subject-header");
  if (header) {
    const sec = header.closest(".subject");
    const open = sec.classList.toggle("open");
    header.setAttribute("aria-expanded", String(open));
    return;
  }
  const lesson = e.target.closest(".lesson");
  if (lesson) openModal(+lesson.dataset.si, +lesson.dataset.li);
});

/* ---------- модалка ---------- */
function openModal(si, li) {
  const subj = DATA.subjects[si];
  const l = subj && subj.lessons[li];
  if (!l) return;

  const teacher = (l.teacher || subj.teacher || "").trim() || "—";
  const hasLink = !!(l.link && String(l.link).trim());

  modalBody.innerHTML = `
    <div class="m-head">
      <span class="subj-mark" style="${markStyle(subj.name)}">${esc(initials(subj.name))}</span>
      <div class="m-head-text">
        <h3>${esc(subj.name)}</h3>
        <p>${esc(teacher)}</p>
      </div>
    </div>

    <div class="m-grid">
      <div class="m-row"><span class="m-label">Дата</span><span class="m-value">${esc(fmtLong(l.date))}</span></div>
      <div class="m-row"><span class="m-label">Пара</span><span class="m-value">${l.pair ? esc(l.pair) + "-я пара" : "—"}</span></div>
      <div class="m-row"><span class="m-label">Заметка</span><span class="m-value">${esc(l.comment || "—")}</span></div>
    </div>

    ${hasLink
      ? `<a class="watch" href="${esc(l.link)}" target="_blank" rel="noopener">
           <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Перейти по ссылке
         </a>`
      : `<div class="no-link"><i class="dot"></i> Ссылка не указана</div>`}
  `;

  modal.classList.add("open");
  document.body.classList.add("no-scroll");
  closeBtn.focus();
}

function closeModal() {
  modal.classList.remove("open");
  document.body.classList.remove("no-scroll");
}

closeBtn.addEventListener("click", closeModal);
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});

/* ---------- поиск ---------- */
search.addEventListener("input", render);
clearBtn.addEventListener("click", () => {
  search.value = "";
  render();
  search.focus();
});

/* ---------- развернуть / свернуть всё ---------- */
toggleAllBtn.addEventListener("click", () => {
  allOpen = !allOpen;
  toggleAllBtn.textContent = allOpen ? "Свернуть" : "Развернуть";
  main.querySelectorAll(".subject").forEach(sec => {
    sec.classList.toggle("open", allOpen);
    const h = sec.querySelector(".subject-header");
    if (h) h.setAttribute("aria-expanded", String(allOpen));
  });
});

/* ---------- тема ---------- */
themeBtn.addEventListener("click", () => {
  const next = root.dataset.theme === "light" ? "dark" : "light";
  root.dataset.theme = next;
  try { localStorage.setItem("ri-theme", next); } catch (e) {}
});

render();
</script>
